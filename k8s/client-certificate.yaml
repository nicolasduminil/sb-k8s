# The CLIENT certificate, signed by the SAME CA issuer as the server. Because
# the server trusts that CA, this certificate is accepted during the mTLS
# handshake; any client without a CA-signed certificate is rejected.
#
# It is stored as PEM (tls.crt / tls.key / ca.crt) in the sb-k8s-client-cert
# secret so it can be handed straight to curl:
#   curl --cacert ca.crt --cert tls.crt --key tls.key https://localhost:8443/...
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s-client
spec:
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: sb-k8s-client-cert
  commonName: sb-k8s-client
  usages:
    - client auth
    - digital signature
  renewBefore: 5m
