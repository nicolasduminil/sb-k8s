# CLIENT certificates, signed by the SAME CA issuer as the server. Because the
# server trusts that CA, both pass the transport-level mTLS handshake. Spring
# Security X.509 then reads each certificate's CN and maps it to an application
# identity with roles (see SecurityConfig):
#   CN=sb-k8s-admin -> ROLE_ADMIN + ROLE_USER
#   CN=sb-k8s-user  -> ROLE_USER
# This is what turns "any CA-signed client" into a named, authorized user.
#
# Each is stored as PEM (tls.crt / tls.key / ca.crt) so it can be handed to curl:
#   curl --cacert ca.crt --cert admin.crt --key admin.key https://localhost:8443/...
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s-admin
spec:
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: sb-k8s-admin-cert
  commonName: sb-k8s-admin
  usages:
    - client auth
    - digital signature
  renewBefore: 5m
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s-user
spec:
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: sb-k8s-user-cert
  commonName: sb-k8s-user
  usages:
    - client auth
    - digital signature
  renewBefore: 5m
---
# A CA-signed certificate whose CN is deliberately NOT one of the known
# identities in SecurityConfig. It clears the mTLS handshake (the CA is trusted)
# yet the app rejects it (401/403) - the e2e case that proves authorization is
# keyed on identity, not merely on CA trust.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s-intruder
spec:
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: sb-k8s-intruder-cert
  commonName: sb-k8s-intruder
  usages:
    - client auth
    - digital signature
  renewBefore: 5m
