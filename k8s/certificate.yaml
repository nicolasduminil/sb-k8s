# The SERVER certificate, signed by the CA issuer. cert-manager also builds a
# JKS keystore (the server identity) and a JKS truststore (containing the CA)
# out of it. The truststore is what the server uses to validate incoming client
# certificates during the mTLS handshake.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s
spec:
  keystores:
    jks:
      passwordSecretRef:
        name: jks-password-secret
        key: password
      create: true
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - sb-k8s
    - localhost
  secretName: sb-k8s-cert
  commonName: sb-k8s
  usages:
    - server auth
    - digital signature
    - key encipherment
  renewBefore: 5m
