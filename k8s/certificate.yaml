apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s
spec:
  keystores:
    jks:
      passwordSecretRef:
        name: jks-password-secret
        key: password
      create: true
  issuerRef:
    name: ss-cluster-issuer
    group: cert-manager.io
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - sb-k8s
    - localhost
  secretName: sb-k8s-cert
  commonName: sb-k8s
  renewBefore: 5m