apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sb-k8s
spec:
  keystores:
    jks:
      passwordSecretRef:
        name: jks-password-secret
        key: password
      create: true
  issuerRef:
    name: ca-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - sb-k8s
    - localhost
  secretName: sb-k8s-cert
  commonName: sb-k8s
  usages:
    - server auth
    - digital signature
    - key encipherment
  duration: 1h
  renewBefore: 5m
