apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: sb-k8s
build:
  tagPolicy:
    envTemplate:
      template: "buildpacks"
  artifacts:
    - image: nicolasduminil/k8s-sb
      buildpacks:
        builder: paketobuildpacks/builder-jammy-base
        trustBuilder: true
        env:
          - "BP_JVM_VERSION=21"
manifests:
  rawYaml:
    - k8s/certificate.yaml
    - k8s/cluster-issuer.yaml
    - k8s/configmap.yaml
    - k8s/deployment.yaml
    - k8s/secret.yaml
    - k8s/service.yaml
