apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: sb-k8s
build:
  tagPolicy:
    envTemplate:
      template: "buildpacks"
  artifacts:
    - image: nicolasduminil/k8s-sb
      buildpacks:
        builder: paketobuildpacks/builder-jammy-base
        trustBuilder: true
        env:
          - "BP_JVM_VERSION=21"
manifests:
  rawYaml:
    - k8s/issuers.yaml
    - k8s/certificate.yaml
    - k8s/client-certificate.yaml
    - k8s/configmap.yaml
    - k8s/deployment.yaml
    - k8s/secret.yaml
    - k8s/service.yaml
# Auto port-forward the HTTPS service to localhost:8443 when running
# `skaffold dev --port-forward`. Skaffold re-establishes the forward
# automatically whenever the pod is replaced (rollout, crash, redeploy).
portForward:
  - resourceType: service
    resourceName: sb-k8s
    port: 8443
    localPort: 8443
profiles:
  # `skaffold run -p reset` (used by redeploy.sh) deletes the cert-manager
  # -generated secrets before deploying, so they are re-issued cleanly - useful
  # when switching branches, since their contents differ between cert-manager
  # and mtls. Kept in a profile so plain `skaffold dev`/`run` don't churn certs.
  - name: reset
    deploy:
      kubectl:
        hooks:
          before:
            - host:
                command:
                  - sh
                  - -c
                  - "kubectl delete secret sb-k8s-cert sb-k8s-ca sb-k8s-admin-cert sb-k8s-user-cert sb-k8s-intruder-cert --ignore-not-found"
                os:
                  - linux
                  - darwin
